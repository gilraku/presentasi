name: Terbitkan presentasi ke GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil berkas presentasi
        uses: actions/checkout@v6

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah presentasi statis
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
